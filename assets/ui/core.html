<!--
  Core utilities and global functions
  Includes number formatting and global state initialization
-->

<script>
  // Global function to show/hide HUD elements when modals are open
  window.setModalOpen = function(isOpen) {
    if (isOpen) {
      document.body.classList.add('modal-open');
    } else {
      document.body.classList.remove('modal-open');
    }
  };

  // Check if any modal is currently open (has .visible class)
  window.isAnyModalOpen = function() {
    // Check all known modal IDs
    const modalIds = [
      'pickaxe-modal',
      'miner-modal',
      'rebirth-modal',
      'pets-modal',
      'achievements-modal',
      'leaderboard-modal',
      'egg-modal',
      'reward-modal',
      'golden-machine-modal',
      'maps-modal',
      'merchant-ui',
      'gem-trader-ui',
      'mine-reset-upgrade-ui'
    ];

    for (const id of modalIds) {
      const modal = document.getElementById(id);
      if (modal && modal.classList.contains('visible')) {
        return true;
      }
    }
    return false;
  };

  const COMPACT_SUFFIXES = [
    '', 'K', 'M', 'B', 'T', 'Qd', 'Qn', 'Sx', 'Sp', 'Oc', 'No',
    'De', 'UDe', 'DDe', 'TDe', 'QaDe', 'QiDe', 'SxDe', 'SpDe', 'OcDe', 'NoDe',
    'Vg', 'UVg', 'DVg', 'TVg', 'QaVg', 'QiVg', 'SxVg', 'SpVg', 'OcVg', 'NoVg',
    'Tg', 'UTg', 'DTg', 'TTg', 'QaTg', 'QiTg', 'SxTg', 'SpTg', 'OcTg', 'NoTg',
    'Qag', 'UQag', 'DQag', 'TQag',
  ];

  function getCompactSuffix(tier) {
    if (tier < COMPACT_SUFFIXES.length) return COMPACT_SUFFIXES[tier];
    return `e${tier * 3}`;
  }

  function formatCompactFromIntegerString(rawValue, maxSignificantDigits = 3) {
    const raw = String(rawValue ?? '').trim();
    if (!raw) return '0';
    const negative = raw.startsWith('-');
    const digits = raw.replace(/[^0-9]/g, '').replace(/^0+/, '') || '0';
    if (digits === '0') return '0';

    const tier = Math.floor((digits.length - 1) / 3);
    if (tier <= 0) return (negative ? '-' : '') + digits;

    const headLen = digits.length - (tier * 3);
    const decimalsAllowed = Math.max(0, maxSignificantDigits - headLen);
    const whole = digits.slice(0, headLen);
    const fracRaw = digits.slice(headLen, headLen + decimalsAllowed);
    const frac = fracRaw.replace(/0+$/, '');
    const compact = frac ? `${whole}.${frac}` : whole;

    return (negative ? '-' : '') + compact + getCompactSuffix(tier);
  }

  function formatCompactFromNumber(value, maxSignificantDigits = 3) {
    const num = Number(value);
    if (!Number.isFinite(num)) return String(value);
    if (num === 0) return '0';

    const negative = num < 0;
    let abs = Math.abs(num);
    let tier = 0;

    while (abs >= 1000) {
      abs /= 1000;
      tier++;
    }

    const intDigits = abs >= 100 ? 3 : abs >= 10 ? 2 : 1;
    const decimalsAllowed = Math.max(0, maxSignificantDigits - intDigits);
    let compact = abs.toFixed(decimalsAllowed).replace(/\.?0+$/, '');

    if (Number(compact) >= 1000) {
      tier++;
      compact = '1';
    }

    return (negative ? '-' : '') + compact + getCompactSuffix(tier);
  }

  function formatCompactValue(value, maxSignificantDigits = 3) {
    const raw = String(value ?? '').trim();
    if (/^-?\d+$/.test(raw)) {
      return formatCompactFromIntegerString(raw, maxSignificantDigits);
    }

    const num = Number(value);
    if (Number.isFinite(num)) {
      return formatCompactFromNumber(num, maxSignificantDigits);
    }

    return '0';
  }

  // Format number for popups - max 3 significant digits with suffixes
  function formatPopupNumber(value) {
    return formatCompactValue(value, 3);
  }

  // Global number formatting function - max 3 significant digits with suffixes
  function formatNumber(value) {
    return formatCompactValue(value, 3);
  }
</script>
